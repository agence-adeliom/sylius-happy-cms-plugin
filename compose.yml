services:
    php:
        image: ghcr.io/sylius/sylius-php:8.5-alpine
        environment:
            # The plugin is the root package: without a git tag Composer sees it as 1.0.0+no-version-set,
            # which trips the "conflict" constraints declared by easy-crud (<2.3.1).
            COMPOSER_ROOT_VERSION: ${COMPOSER_ROOT_VERSION:-2.3.1}
    mysql:
        image: mysql:8.4
        platform: linux/amd64
        healthcheck:
            test: '/usr/bin/mysql --execute "SHOW databases;"'
            timeout: 3s
            interval: 1s
            retries: 10
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        cap_add:
            - SYS_NICE # prevent "mbind: Operation not permitted" errors
    nginx:
        image: ghcr.io/sylius/sylius-nginx:latest
        depends_on:
            -   php
    mailhog:
        # do not use in production!
        image: mailhog/mailhog:latest
