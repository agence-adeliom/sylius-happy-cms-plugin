sylius_resource:
  resources:
    sylius_happy_cms.route:
      driver: doctrine/orm
      classes:
        model: Adeliom\SyliusHappyCMSPlugin\Entity\Cmf\Route
        repository: Adeliom\SyliusHappyCMSPlugin\Repository\Cmf\RouteRepository
        controller: Adeliom\SyliusEasyCrudPlugin\Controller\SyliusCrudResourceController
        form: Adeliom\SyliusHappyCMSPlugin\Admin\Cmf\RouteAdmin
    sylius_happy_cms.redirect_route:
      driver: doctrine/orm
      classes:
        model: Adeliom\SyliusHappyCMSPlugin\Entity\Cmf\RedirectRoute
        repository: Adeliom\SyliusHappyCMSPlugin\Repository\Cmf\RedirectRouteRepository
        controller: Adeliom\SyliusEasyCrudPlugin\Controller\SyliusCrudResourceController
        form: Adeliom\SyliusHappyCMSPlugin\Admin\Cmf\RedirectRouteAdmin
