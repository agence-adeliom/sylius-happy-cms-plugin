# Backward compatible entry point: imports the admin routes of the plugin
# under the Sylius admin path (`/admin` by default, see the
# SYLIUS_ADMIN_ROUTING_PATH_NAME environment variable).
# To choose the prefix or the host yourself, import
# `@SyliusHappyCMSPlugin/config/routes/admin.yaml` and
# `@SyliusHappyCMSPlugin/config/routes/media_admin.php` instead.
sylius_happy_cms_admin:
    resource: "@SyliusHappyCMSPlugin/config/routes/admin.yaml"
    prefix: '/%sylius_admin.path_name%'

# Media manager routes (`media.*`), under the Sylius admin path too.
sylius_happy_cms_media_admin:
    resource: routes/media_admin.php
    prefix: '/%sylius_admin.path_name%'

# Public download route (`media.file_download`, /media/download/{path}), not under the admin path.
sylius_happy_cms_media_public:
    resource: routes/media_public.php
