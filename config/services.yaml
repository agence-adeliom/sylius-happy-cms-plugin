imports:
  - { resource: services/pages.yaml }
  - { resource: services/seo.yaml }
  - { resource: services/menu.yaml }
  - { resource: services/config.yaml }
  - { resource: services/block.yaml }
  - { resource: services/maker.yaml }
  - { resource: services/ai.yaml }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  Adeliom\SyliusHappyCMSPlugin\ContextProvider\CreateSharedBlockContextProvider:
    arguments:
      - '@sylius.happy_cms.shared_block.block_collection'
    tags:
      - { name: sylius.twig_hooks.context_provider }

  sylius.happy_cms.plugin.listener.entity_route_indexer:
    class: Adeliom\SyliusHappyCMSPlugin\EventListener\EntityRouteIndexer
    arguments:
      - '@cmf_routing.orm_content_repository'
      - "@parameter_bag"
      - "@event_dispatcher"
      - "@doctrine.orm.entity_manager"
      - '%sylius_happy_cms.routing.url_pattern%'
      - '%sylius_happy_cms.routing.collapse_slashes%'
    tags:
      -   name: 'doctrine.event_listener'
          event: 'postPersist'
          priority: 500
          connection: 'default'
      -   name: 'doctrine.event_listener'
          event: 'postUpdate'
          priority: 500
          connection: 'default'
      -   name: 'doctrine.event_listener'
          event: 'postFlush'
          connection: 'default'

  Adeliom\SyliusHappyCMSPlugin\Services\Cmf\RouteRenderService:
    alias: sylius.happy_cms.plugin.services.render
    public: true

  Adeliom\SyliusHappyCMSPlugin\Repository\Menu\MenuRepositoryInterface:
    alias: happy_cms_menu.menu.repository

  Adeliom\SyliusHappyCMSPlugin\Repository\Menu\MenuItemRepositoryInterface:
    alias: happy_cms_menu.menu_item.repository

  Adeliom\SyliusHappyCMSPlugin\Repository\Page\PageRepositoryInterface:
    alias: happy_cms_page.page.repository

  Adeliom\SyliusHappyCMSPlugin\Repository\Cmf\RouteRepositoryInterface:
    alias: happy_cms_page.route.repository

  sylius.happy_cms.plugin.services.render:
    class: Adeliom\SyliusHappyCMSPlugin\Services\Cmf\RouteRenderService
    arguments:
      - "@router"
      - "@sylius.resource_controller.request_configuration_factory"
      - "@twig"
      - "@event_dispatcher"
      - "@happy_cms_seo.breadcrumb"
      - "@kernel"
      - "@doctrine.orm.entity_manager"
      - "@parameter_bag"
    public: true

  sylius.happy_cms.plugin.controller.render:
    class: Adeliom\SyliusHappyCMSPlugin\Controller\Routing\RenderController
    arguments:
      - "@sylius.happy_cms.plugin.services.render"
    public: true

  Adeliom\SyliusHappyCMSPlugin\Asset\AssetHappyCMSPackage:
    arguments:
      $easyMediaManager: '%sylius_happy_cms.media.easy_media_manager.enabled%'
    tags:
      -   assets.package: { package: 'sylius.happy.cms.assets.package' }

  Adeliom\SyliusHappyCMSPlugin\Security\ContentDocumentVoter:
    arguments:
      - '@security.authorization_checker'
    tags:
      - "security.voter"
  
  
  sylius.happy_cms.plugin.security.preview_request_matcher:
    class: Adeliom\SyliusHappyCMSPlugin\Security\PreviewRequestMatcher
    public: true

  Adeliom\SyliusHappyCMSPlugin\Security\PreviewRequestMatcher: '@sylius.happy_cms.plugin.security.preview_request_matcher'

  Adeliom\SyliusHappyCMSPlugin\Security\Preview\PreviewUrlSigner:
    arguments:
      - '@security.authorization_checker'
      - '@uri_signer'
      - '@request_stack'
      - '@clock'
      - '%sylius_happy_cms.page_builder.preview_url_ttl%'

  Adeliom\SyliusHappyCMSPlugin\Security\Preview\PreviewUrlSignerInterface: '@Adeliom\SyliusHappyCMSPlugin\Security\Preview\PreviewUrlSigner'

  Adeliom\SyliusHappyCMSPlugin\Security\Preview\SignedPreviewRequestValidator:
    arguments:
      - '@sylius.happy_cms.plugin.security.preview_request_matcher'
      - '@uri_signer'

  Adeliom\SyliusHappyCMSPlugin\Security\Preview\SignedPreviewRequestValidatorInterface: '@Adeliom\SyliusHappyCMSPlugin\Security\Preview\SignedPreviewRequestValidator'

  Adeliom\SyliusHappyCMSPlugin\Security\Preview\PreviewUrlGenerator:
    arguments:
      - '@router'
      - '@Adeliom\SyliusHappyCMSPlugin\Security\Preview\PreviewUrlSignerInterface'

  Adeliom\SyliusHappyCMSPlugin\Security\Preview\PreviewUrlGeneratorInterface: '@Adeliom\SyliusHappyCMSPlugin\Security\Preview\PreviewUrlGenerator'

  Adeliom\SyliusHappyCMSPlugin\Twig\PreviewUrlExtension:
    arguments:
      - '@Adeliom\SyliusHappyCMSPlugin\Security\Preview\PreviewUrlGeneratorInterface'
    tags:
      - { name: twig.extension }

  Adeliom\SyliusHappyCMSPlugin\EventListener\PreviewResponseListener:
    arguments:
      - '@sylius.happy_cms.plugin.security.preview_request_matcher'
      - '@Adeliom\SyliusHappyCMSPlugin\Security\Preview\SignedPreviewRequestValidatorInterface'
      - '@assets.packages'
    tags:
      # After Symfony's ResponseListener (Content-Type) and Sylius' XFrameOptionsSubscriber (priority 0)
      - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: -128 }

  Adeliom\SyliusHappyCMSPlugin\Security\SignedPreviewVoter:
    arguments:
      - '@request_stack'
      - '@Adeliom\SyliusHappyCMSPlugin\Security\Preview\SignedPreviewRequestValidatorInterface'
      - '%sylius.resources%'
    tags:
      - "security.voter"


  # pages
  # ===============================


  # todo interface alias
  sylius.happy_cms.page.all_pages:
    class: Adeliom\SyliusHappyCMSPlugin\Doctrine\Query\Page\AllPages
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@sylius_admin.context.locale.admin_based"
      - "@sylius.translation_locale_provider"

  # todo interface alias
  sylius.happy_cms.admin.page_tree.tree:
    class: Adeliom\SyliusHappyCMSPlugin\Twig\Components\PageTree\TreeComponent
    arguments:
      - "@sylius.happy_cms.page.all_pages"
    tags:
      - { name: sylius.live_component.admin, key: happycms-page-tree-tree }

  # todo interface alias
  sylius.happy_cms.admin.page_tree.delete:
    class: Adeliom\SyliusHappyCMSPlugin\Twig\Components\PageTree\DeleteComponent
    arguments:
      - "@security.csrf.token_manager"
    tags:
      - { name: sylius.live_component.admin, key: happycms-page-tree-delete, template: '@SyliusHappyCMSPlugin/page/crud/tree/components/delete.html.twig' }

  # menu
  # ===============================


  # todo interface alias
  sylius.happy_cms.menu_item.all_menu_items:
    class: Adeliom\SyliusHappyCMSPlugin\Doctrine\Query\Menu\AllMenuItems
    arguments:
      - "@doctrine.orm.entity_manager"
      - "@sylius_admin.context.locale.admin_based"
      - "@sylius.translation_locale_provider"

  # todo interface alias
  sylius.happy_cms.admin.menu_item_tree.tree:
    class: Adeliom\SyliusHappyCMSPlugin\Twig\Components\MenuItemTree\TreeComponent
    arguments:
      - "@sylius.happy_cms.menu_item.all_menu_items"
    tags:
      - { name: sylius.live_component.admin, key: happycms-menu-item-tree-tree }

  # todo interface alias
  sylius.happy_cms.admin.menu_item_tree.delete:
    class: Adeliom\SyliusHappyCMSPlugin\Twig\Components\MenuItemTree\DeleteComponent
    arguments:
      - "@security.csrf.token_manager"
    tags:
      - { name: sylius.live_component.admin, key: happycms-menu-item-tree-delete, template: '@SyliusHappyCMSPlugin/menu_item/crud/tree/components/delete.html.twig' }

  sylius.happy_cms.plugin.listener.redirection_manager:
    class: Adeliom\SyliusHappyCMSPlugin\Services\Cmf\RedirectionManager
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@parameter_bag'

  Adeliom\SyliusHappyCMSPlugin\Services\Cmf\RedirectionManagerInterface:
    alias: sylius.happy_cms.plugin.listener.redirection_manager

  sylius.happy_cms.exception_listener:
    class: Adeliom\SyliusHappyCMSPlugin\EventListener\ExceptionListener
    arguments:
      - '@sylius.happy_cms.plugin.listener.redirection_manager'
    tags:
      - { name: kernel.event_listener, event: kernel.exception }

  sylius.happy_cms.command.invalid_cache:
    class: Adeliom\SyliusHappyCMSPlugin\Command\InvalidCacheCommand
    arguments:
      - '@sylius.happy_cms.plugin.services.render'
    tags:
      - { name: 'console.command' }

  Adeliom\SyliusHappyCMSPlugin\Command\IndexRoutesCommand:
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@sylius.happy_cms.plugin.listener.entity_route_indexer'
    tags:
      - { name: 'console.command' }

  sylius.happy_cms.command.migrate_content_to_new_block_builder:
    class: Adeliom\SyliusHappyCMSPlugin\Command\MigrateContentToBlocksCommand
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@parameter_bag'
    tags:
      - { name: 'console.command' }

  sylius.happy_cms.command.create_demo_pages:
    class: Adeliom\SyliusHappyCMSPlugin\Command\Starter\CreateDemoPagesCommand
    arguments:
      - '@happy.cms.media.manager'
      - '@kernel'
      - "@parameter_bag"
      - '@doctrine.orm.entity_manager'
      - '@logger'
    tags:
      - { name: 'console.command' }

  sylius.happy_cms.command.create_demo_menu:
    class: Adeliom\SyliusHappyCMSPlugin\Command\Starter\CreateDemoMenuCommand
    arguments:
      - '@happy.cms.media.manager'
      - '@kernel'
      - "@parameter_bag"
      - '@doctrine.orm.entity_manager'
      - '@logger'
    tags:
      - { name: 'console.command' }

  sylius.happy_cms.admin.builder.block_editor:
      class: Adeliom\SyliusHappyCMSPlugin\Twig\Components\Builder\BlockEditor
      arguments:
          - "@sylius.happy_cms.block_collection"
          - "@doctrine.orm.entity_manager"
          - "@parameter_bag"
          - "@sylius.happy_cms.ai.bundle_detector"
      tags:
          - { name: sylius.live_component.admin, key: happycms-builder-block-editor, template: '@SyliusHappyCMSPlugin/admin/page_builder/_block_editor.html.twig' }
      calls:
          - setLiveResponder: ['@ux.live_component.live_responder']

