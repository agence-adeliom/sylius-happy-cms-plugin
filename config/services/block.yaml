services:
  _defaults:
    autowire: true
    autoconfigure: true

  Adeliom\SyliusHappyCMSPlugin\Factory\Block\BlockCollection:
    autoconfigure: true
    public: true
    arguments:
      - !tagged sylius.happy_cms.block

  sylius.happy_cms.block_collection:
    alias: Adeliom\SyliusHappyCMSPlugin\Factory\Block\BlockCollection

  Adeliom\SyliusHappyCMSPlugin\Admin\Field\Configurator\FlexibleContentConfigurator:
    public: true
    arguments:
      - "@sylius.happy_cms.block_collection"
      - "@sylius.happy_cms.shared_block.block_collection"
    tags:
      - 'easy.fields.configurator'

  Adeliom\SyliusHappyCMSPlugin\Admin\Field\Configurator\SharedBlockConfigurator:
    public: true
    arguments:
      - "@sylius.happy_cms.shared_block.block_collection"
    tags:
      - 'easy.fields.configurator'

  Adeliom\SyliusHappyCMSPlugin\Twig\Block\BlockExtension:
    public: true
    tags:
      - { name: twig.extension }

  sylius.happy_cms.block.twig_extension:
    alias: Adeliom\SyliusHappyCMSPlugin\Twig\Block\BlockExtension


  Adeliom\SyliusHappyCMSPlugin\Factory\Block\Helper:
    public: true
    arguments:
      - '@twig'
      - '@event_dispatcher'
      - '@sylius.happy_cms.block_collection'
      - '@adeliom.sylius.asset.renderer'
#      - '@form.factory'
#      - '@doctrine.orm.entity_manager'
#      - '@request_stack'
    tags:
      - { name: twig.runtime }

  sylius.happy_cms.block_helper:
    alias: Adeliom\SyliusHappyCMSPlugin\Factory\Block\Helper

  Adeliom\SyliusHappyCMSPlugin\DataCollector\Block\BlockCollector:
    arguments:
      - "@sylius.happy_cms.block_helper"
    tags:
      - name: data_collector
        template: '@SyliusHappyCMSPlugin/profiler/block/collector.html.twig'
        id: Adeliom\SyliusHappyCMSPlugin\DataCollector\Block\BlockCollector


  # shared block

  Adeliom\SyliusHappyCMSPlugin\Factory\SharedBlock\SharedBlockCollection:
    autoconfigure: true
    public: true
    arguments:
      - !tagged sylius.happy_cms.shared_block

  sylius.happy_cms.shared_block.block_collection:
    alias: Adeliom\SyliusHappyCMSPlugin\Factory\SharedBlock\SharedBlockCollection

  Adeliom\SyliusHappyCMSPlugin\Twig\SharedBlock\SharedBlockExtension:
    public: true
    tags:
      - { name: twig.extension }

  Adeliom\SyliusHappyCMSPlugin\Twig\Cmf\RouteExtension:
    public: true
    tags:
      - { name: twig.extension }

  sylius.happy_cms.shared_block.twig_extension:
    alias: Adeliom\SyliusHappyCMSPlugin\Twig\SharedBlock\SharedBlockExtension

  sylius.happy_cms.shared_block.shared_block_type:
    class: Adeliom\SyliusHappyCMSPlugin\Block\SharedBlockType
    public: true
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@translator'
      - '@form.factory'
    tags: [ 'sylius.happy_cms.block', 'form.type' ]

  Adeliom\SyliusHappyCMSPlugin\Factory\SharedBlock\Helper:
    public: true
    arguments:
      - '@twig'
      - '@event_dispatcher'
      - '@sylius.happy_cms.shared_block.block_collection'
      - '@doctrine.orm.entity_manager'
      - '@request_stack'
      - '@adeliom.sylius.asset.renderer'
#      - '%sylius_happy_cms.shared_block.shared_block_model%'
#      - '@form.factory'
    tags:
      - { name: twig.runtime }

  sylius.happy_cms.shared_block.block_helper:
    alias: Adeliom\SyliusHappyCMSPlugin\Factory\SharedBlock\Helper

  Adeliom\SyliusHappyCMSPlugin\DataCollector\SharedBlock\SharedBlockCollector:
    arguments:
      - "@sylius.happy_cms.shared_block.block_helper"
    tags:
      - name: data_collector
        template: '@SyliusHappyCMSPlugin/profiler/shared_block/collector.html.twig'
        id: Adeliom\SyliusHappyCMSPlugin\DataCollector\SharedBlock\SharedBlockCollector

  Adeliom\SyliusHappyCMSPlugin\Controller\SharedBlock\SharedBlockController:
    arguments:
      - "@twig"
      - "@sylius.happy_cms.shared_block.block_collection"
    tags:
      - controller.service_arguments
      - container.service_subscriber

  Adeliom\SyliusHappyCMSPlugin\SharedBlock\ExampleType:
    public: true
    autoconfigure: true
    tags: [ 'sylius.happy_cms.shared_block' ]


  # all flex boxes
  sylius.happy_cms.blocks.accordion_type:
    class: Adeliom\SyliusHappyCMSPlugin\Block\AccordionBlockType
    public: true
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@translator'
      - '@form.factory'
      - '@assets.packages'
    tags: [ 'sylius.happy_cms.block', 'form.type' ]

  sylius.happy_cms.blocks.cta_block_type:
    class: Adeliom\SyliusHappyCMSPlugin\Block\CtaBlockType
    public: true
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@translator'
      - '@form.factory'
      - '@assets.packages'
    tags: [ 'sylius.happy_cms.block', 'form.type' ]

  sylius.happy_cms.blocks.gallery_block_type:
    class: Adeliom\SyliusHappyCMSPlugin\Block\GalleryBlockType
    public: true
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@translator'
      - '@form.factory'
      - '@assets.packages'
    tags: [ 'sylius.happy_cms.block', 'form.type' ]

  sylius.happy_cms.blocks.key_feature_block_type:
    class: Adeliom\SyliusHappyCMSPlugin\Block\KeyFeaturesBlockType
    public: true
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@translator'
      - '@form.factory'
      - '@assets.packages'
    tags: [ 'sylius.happy_cms.block', 'form.type' ]

  sylius.happy_cms.blocks.text_image_cta_block_type:
    class: Adeliom\SyliusHappyCMSPlugin\Block\TextImageCtaBlockType
    public: true
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@translator'
      - '@form.factory'
      - '@assets.packages'
    tags: [ 'sylius.happy_cms.block', 'form.type' ]

  sylius.happy_cms.blocks.text_cta_block_type:
    class: Adeliom\SyliusHappyCMSPlugin\Block\TextCtaBlockType
    public: true
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@translator'
      - '@form.factory'
      - '@assets.packages'
    tags: [ 'sylius.happy_cms.block', 'form.type' ]

  sylius.happy_cms.blocks.wysiwyg_block_type:
    class: Adeliom\SyliusHappyCMSPlugin\Block\WysiwygBlockType
    public: true
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@translator'
      - '@form.factory'
      - '@assets.packages'
    tags: [ 'sylius.happy_cms.block', 'form.type' ]

  sylius.happy_cms.blocks.seo_block_type:
    class: Adeliom\SyliusHappyCMSPlugin\Block\SeoBlockType
    public: true
    arguments:
      - '@doctrine.orm.entity_manager'
      - '@translator'
      - '@form.factory'
      - '@assets.packages'
    tags: [ 'sylius.happy_cms.block', 'form.type' ]
