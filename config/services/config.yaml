services:
    Adeliom\SyliusHappyCMSPlugin\Services\Config\ConfigValueConverter: ~

    Adeliom\SyliusHappyCMSPlugin\Services\Config\ConfigValueResolver:
        public: true
        arguments:
            - '@sylius_happy_cms.config.repository'
            - '@sylius.context.channel'
            - '@sylius.context.locale'
            - '@sylius.translation_locale_provider'
            - '@Adeliom\SyliusHappyCMSPlugin\Services\Config\ConfigValueConverter'

    Adeliom\SyliusHappyCMSPlugin\Twig\Config\ConfigExtension:
        public: true
        tags:
            - { name: twig.extension }

    # Lazy: the config repository is only built on the first happy_cms_config() call.
    Adeliom\SyliusHappyCMSPlugin\Twig\Config\ConfigRuntime:
        arguments:
            - '@Adeliom\SyliusHappyCMSPlugin\Services\Config\ConfigValueResolver'
        tags:
            - { name: twig.runtime }
