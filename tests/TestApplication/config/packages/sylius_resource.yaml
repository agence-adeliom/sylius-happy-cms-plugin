sylius_resource:
    resources:
        
        sylius_happy_cms.page:
            driver: doctrine/orm
            classes:
                model: Tests\Adeliom\SyliusHappyCMSPlugin\Entity\HappyCMS\Page\Page
                controller: Adeliom\SyliusHappyCMSPlugin\Controller\Page\PageResourceController
                repository: Tests\Adeliom\SyliusHappyCMSPlugin\Repository\HappyCMS\Page\PageRepository
                form: Tests\Adeliom\SyliusHappyCMSPlugin\Admin\HappyCMS\Page\PageAdmin
            translation:
                classes:
                    model: Tests\Adeliom\SyliusHappyCMSPlugin\Entity\HappyCMS\Page\PageTranslation
                    controller: Adeliom\SyliusEasyCrudPlugin\Controller\SyliusCrudResourceController
                    form: Tests\Adeliom\SyliusHappyCMSPlugin\Admin\HappyCMS\Page\PageAdmin
        
        
