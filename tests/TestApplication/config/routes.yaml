sylius_easy_crud:
    resource: "@SyliusEasyCrudPlugin/config/routes.yaml"

sylius_happy_cms:
    resource: "@SyliusHappyCMSPlugin/config/routes.yaml"

sylius_happy_cms_page_admin:
    resource: |
        alias: sylius_happy_cms.page
        section: admin
        templates: "@SyliusHappyCMSPlugin\\page\\crud"
        redirect: update
        grid: sylius_happy_cms_page_admin
        form:
            type: Tests\Adeliom\SyliusHappyCMSPlugin\Admin\HappyCMS\Page\PageAdmin
            options:
                context: $context
        vars:
            all:
                icon: 'file'
                subheader: sylius_happy_cms.page.admin.ui.subheader
                breadcrumb: sylius_happy_cms.page.admin.ui.index
                templates:
                    form: "@SyliusEasyCrudPlugin\\crud\\form\\_form.html.twig"
            index:
                header: sylius_happy_cms.page.admin.ui.index
            create:
                header: sylius_happy_cms.page.admin.ui.create
            update:
                header: sylius_happy_cms.page.admin.ui.update
                redirect:
                    route: update
                    parameters:
                        context: $context
                        id: $id
                route:
                    parameters:
                        context: $context
                        id: $id
            show:
                header: sylius_happy_cms.page.admin.ui.show
                redirect:
                    route: update # needed to redirect from show to update after updating flex content
                    parameters:
                        context: $context
                        id: $id
                route:
                    parameters:
                        context: $context
         # needed to keep context in URL after updating flex content
                        id: $id
    type: sylius.resource
    prefix: admin

