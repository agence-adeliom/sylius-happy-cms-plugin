parameters:
  cmf_routing.dynamic.persistence.orm.route_class: Tests\Adeliom\SyliusHappyCMSPlugin\Entity\HappyCMS\Cmf\Route

services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    Tests\Adeliom\SyliusHappyCMSPlugin\:
        resource: '../src/*'
        exclude: '../src/{Entity,Kernel.php}'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
#    Tests\Adeliom\SyliusHappyCMSPlugin\Controller\:
#        resource: '../src/Controller'
#        tags: ['controller.service_arguments']


    adeliom.sylius.cms.plugin.listener.admin.menu_builder:
      class: Adeliom\SyliusHappyCMSPlugin\Menu\AdminMenuListener
      tags:
        - { name: kernel.event_listener, event: sylius.menu.admin.main, method: addAdminMenuItems }


    # Workaround: symfony/ai-* 0.3 pulls phpdocumentor/reflection-docblock, which enables API Platform's
    # PhpStanExtractor. symfony/type-info 8.1 then crashes on gedmo's "@phpstan-template T of Loggable|object"
    # (AbstractLogEntry) while warming up the API routes. Redefining the service drops its extractor tag.
    api_platform.property_info.phpstan_extractor:
      class: Symfony\Component\PropertyInfo\Extractor\PhpStanExtractor
      autoconfigure: false
